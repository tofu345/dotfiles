set -g mode-keys vi

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind ^ last-window

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

bind C new-window
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"

bind f neww tms
bind b set-option status

# display in same order as `C-b (` and `C-b )` https://stackoverflow.com/a/63854302
bind s choose-tree -sZ -O name

bind m set -g mouse off
bind M set -g mouse on
setw -g mouse on

# https://unix.stackexchange.com/questions/58588/kill-a-tmux-session-and-select-another-tmux-session
bind X confirm-before -p "Kill session #S (y/n)?" "run-shell 'tmux switch-client -n \; tmux kill-session -t \"#S\"'"

set -g set-titles on
set -g set-titles-string "#S - #W"

set -g allow-rename off
set -g focus-events on
set -s escape-time 200

set -g mode-style "fg=black,bg=yellow"
set -g pane-border-style bg=default
set -g status-left '[#{=/35/..:session_name}] '
set -g status-left-length 40
set -g status-style "bg=default,#{?client_prefix,fg=yellow,fg=white}"

# don't touch this, don't you dare
set -a terminal-features 'alacritty:RGB'

# tpm - tmux plugins
# install with `git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm`
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
