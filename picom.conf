# https://gist.github.com/jamescherti/59f61eeaf17ccc16e1eab2c98d699d31

backend = "xrender"; # `xrender`, `glx`, `egl` or `xr_glx_hybrid`
experimental-backends = false;
vsync = true;
detect-transient = true; #?
shadow = false;
no-dock-shadow = true;
corner-radius = 0;

blur-background = false;
# blur: {
# 	method = "dual_kawase";
# 	size = 5;
# 	deviation = 5.0;
# 	strength = 3;
# 	background-frame = false;
# 	background-fixed = false;
# }

rules: (
    {
        match = "class_g = 'dwm'";
        opacity = 1;
    },
    {
        match = "class_g = 'Dunst'";
        opacity = 1;
    },
    {
        match = "class_g = 'slop'";
        blur-background = false;
    },
    {
        match = "window_type = 'popup_menu' || window_type = 'menu' || window_type = 'dropdown_menu' || window_type = 'utility'";
        blur-background = false;
        shadow = false;
    },
)
